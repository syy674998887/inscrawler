name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check --no-cache src tests tools gui.py
      - name: Check formatting
        run: uv run --no-sync ruff format --check --no-cache src tests tools gui.py
      - name: Offline regression tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: uv build
      - name: Check distribution contents
        run: uv run --no-sync python tools/check_distribution.py
