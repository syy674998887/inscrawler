[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inscrawler"
version = "1.0"
description = "A Qt desktop application for downloading Instagram media with Instaloader"
authors = [{ name = "Untargetable" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "instaloader==4.16",
    "pyside6>=6.11.0",
    "requests==2.33.0",
]

[project.scripts]
inscrawler = "inscrawler.app:main"

[dependency-groups]
dev = ["ruff==0.16.6"]
installer = ["cx-Freeze==8.7.4; sys_platform == 'win32' and python_version == '3.13'"]

[[tool.cxfreeze.executables]]
script = "gui.py"
base = "gui"
target-name = "inscrawler"
icon = "src/inscrawler/assets/logo.ico"

[tool.cxfreeze.build_exe]
excludes = ["tkinter"]
include-msvcr = true

[tool.ruff]
cache-dir = "~/.cache/ruff"

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/inscrawler/ui/qt.py" = ["F401"]

[tool.hatch.build]
exclude = ["AGENTS.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/inscrawler"]

[tool.hatch.build.targets.sdist]
include = ["src/inscrawler", "tests", "tools", "README.md", "README.zh-CN.md", "pyproject.toml", "uv.lock", ".env.example", "gui.py"]
